[package]
name = "uia"
description = "OcrProvider via Windows UI Automation (target-window text) on a COM MTA worker, with OCR fallback. See specs/03 §3/§3b, docs/0.2.0.md (#48)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
traits.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true

# Windows-only by design (04 guardrails). UI Automation + COM init + the
# foreground-window probe + monitor enumeration (to map a monitor_index to its
# screen-pixel bounds, since UIA bounding rects are virtual-desktop coordinates).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[dev-dependencies]
image.workspace = true
