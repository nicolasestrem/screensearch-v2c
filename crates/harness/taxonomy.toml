# ScreenSearch 0.4.0 recognition taxonomy — D7 SEED set (specs/03 §7e, docs/0.4.0.md D6/D7).
#
# This is the versioned data file the recognition heuristic reads. In PR2 it is the harness's
# candidate; PR4 ships the file TUNED against the real captures this harness scores. Adding a
# tool = editing this file (a user override file is deferred, 07 #107).
#
# Matching (case-insensitive), per [[entry]], evaluated in file order, first match wins
# (most specific entries first):
#   app_ok   = app_hints empty  OR frame app_hint EQUALS one hint (exact stem, ".exe" stripped)
#   title_ok = title_patterns empty OR frame window_title CONTAINS one pattern (substring)
#   match    = app_ok AND title_ok   (an entry with BOTH lists empty is a parse error)
# app_hint is matched by exact stem, NOT substring: a process named "codex" must not collide
# with an IDE hint "code" (the 2026-07-09 PR2 finding). title stays substring so a terminal
# entry can prove which tool is running from the window title; an app-only entry (a dedicated
# desktop app) matches on the executable stem alone.
#
# app_hint is the foreground process file STEM (no ".exe"; crates/capture privacy.rs
# process_name) — e.g. "WindowsTerminal", "codex", "chrome", "Claude". Patterns are lowercase.
#
# domains: matched against browser_url's domain — DORMANT today (production capture persists
# browser_url = NULL, gap #109). Listed per the §7e format so the refinement activates if URL
# capture ever lands; browser-AI recognition currently keys on app_hint + window-title.
#
# Tuning (Phase B, 2026-07-09, on the 07-07/07-08 ground truth): codex is a DESKTOP app on this
# install (app_hint "codex", title "Codex"), not a terminal — corrected here. vscode and cursor
# are dropped: unused by the maintainer, and the old substring match made "codex" collide with
# the vscode "code" stem. Known limitation still open: Claude Code sets the terminal title to the
# current task with a spinner/sparkle prefix, so the "claude" title pattern misses task-titled
# frames (a spinner-aware title match is the follow-up; 07 gap).

version = 2

# ---- AI tools (kind = "ai": a tool id is recorded on the session) ----

[[entry]]
id = "claude-code"
kind = "ai"
host = "terminal"
app_hints = ["windowsterminal", "wt", "powershell", "pwsh", "cmd", "conhost", "alacritty", "wezterm"]
title_patterns = ["claude"]
domains = []

[[entry]]
id = "codex"
kind = "ai"
host = "desktop"
app_hints = ["codex"]
title_patterns = []
domains = []

[[entry]]
id = "claude-desktop"
kind = "ai"
host = "desktop"
app_hints = ["claude"]
title_patterns = []
domains = []

[[entry]]
id = "browser-ai"
kind = "ai"
host = "browser"
app_hints = ["chrome", "msedge", "firefox", "brave", "opera"]
title_patterns = ["claude", "chatgpt", "gemini"]
domains = ["claude.ai", "chatgpt.com", "gemini.google.com"]

# ---- Meetings (kind = "meeting": metadata only, D14; harness scores the id, production
#      sessions.tool stays NULL per the §4 CHECK — the harness span is not schema-bound) ----

[[entry]]
id = "zoom"
kind = "meeting"
host = "desktop"
app_hints = ["zoom"]
title_patterns = ["zoom meeting"]
domains = []

[[entry]]
id = "teams"
kind = "meeting"
host = "desktop"
app_hints = ["ms-teams", "teams"]
title_patterns = []
domains = []

[[entry]]
id = "meet"
kind = "meeting"
host = "browser"
app_hints = ["chrome", "msedge", "firefox", "brave", "opera"]
title_patterns = ["google meet", "meet -"]
domains = ["meet.google.com"]

[[entry]]
id = "webex"
kind = "meeting"
host = "desktop"
app_hints = ["webex", "ciscocollab", "atmgr"]
title_patterns = []
domains = []

[[entry]]
id = "discord"
kind = "meeting"
host = "desktop"
app_hints = ["discord"]
title_patterns = []
domains = []
